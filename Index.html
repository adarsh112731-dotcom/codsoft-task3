<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sanSs-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
}

.calculator{
    width:380px;
    background:#111827;
    border-radius:25px;
    padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.display{
    width:100%;
    height:90px;
    border:none;
    outline:none;
    background:#0b1220;
    color:#fff;
    font-size:2rem;
    text-align:right;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:65px;
    border:none;
    border-radius:15px;
    font-size:1.3rem;
    cursor:pointer;
    transition:0.2s;
    font-weight:600;
}

button:hover{
    transform:scale(1.05);
}

.number{
    background:#1f2937;
    color:white;
}

.operator{
    background:#2563eb;
    color:white;
}

.equal{
    background:#10b981;
    color:white;
}

.clear{
    background:#ef4444;
    color:white;
}

.zero{
    grid-column:span 2;
}

.title{
    text-align:center;
    color:#60a5fa;
    margin-bottom:15px;
    font-size:1.4rem;
    font-weight:700;
}

.hint{
    text-align:center;
    color:#94a3b8;
    margin-top:15px;
    font-size:13px;
}
</style>
</head>
<body>

<div class="calculator">

    <div class="title">Professional Calculator</div>

    <input type="text" class="display" id="display" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="append('%')">%</button>
        <button class="operator" onclick="backspace()">⌫</button>
        <button class="operator" onclick="append('/')">÷</button>

        <button class="number" onclick="append('7')">7</button>
        <button class="number" onclick="append('8')">8</button>
        <button class="number" onclick="append('9')">9</button>
        <button class="operator" onclick="append('*')">×</button>

        <button class="number" onclick="append('4')">4</button>
        <button class="number" onclick="append('5')">5</button>
        <button class="number" onclick="append('6')">6</button>
        <button class="operator" onclick="append('-')">−</button>

        <button class="number" onclick="append('1')">1</button>
        <button class="number" onclick="append('2')">2</button>
        <button class="number" onclick="append('3')">3</button>
        <button class="operator" onclick="append('+')">+</button>

        <button class="number zero" onclick="append('0')">0</button>
        <button class="number" onclick="append('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

    <div class="hint">
        Keyboard Supported: 0-9, +, -, *, /, %, Enter, Backspace
    </div>

</div>

<script>
const display = document.getElementById("display");

function append(value){
    display.value += value;
}

function clearDisplay(){
    display.value = "";
}

function backspace(){
    display.value = display.value.slice(0,-1);
}

function calculate(){
    try{
        display.value = eval(display.value);
    }
    catch{
        display.value = "Error";
        setTimeout(() => {
            display.value = "";
        },1000);
    }
}

/* Keyboard Support */
document.addEventListener("keydown",(e)=>{

    const key = e.key;

    if(
        (key >= "0" && key <= "9") ||
        key === "+" ||
        key === "-" ||
        key === "*" ||
        key === "/" ||
        key === "." ||
        key === "%"
    ){
        display.value += key;
    }

    else if(key === "Enter"){
        e.preventDefault();
        calculate();
    }

    else if(key === "Backspace"){
        backspace();
    }

    else if(key === "Escape"){
        clearDisplay();
    }
});
</script>

</body>
</html>
</body>
</html>
